<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scrabble Puzzle</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <h1>Scrabble Puzzle</h1>

        <p class="description">
            Generate a connected 7×7 Scrabble board.
        </p>

        <button id="generateButton">
            Generate Board
        </button>

        <div
            id="board"
            class="board"
        ></div>


        <!-- PLAYER TILE RACK -->

        <section class="rack-section">

            <h2>Your Tiles</h2>

            <div
                id="tileRack"
                class="tile-rack"
            ></div>

            <p
                id="tileMessage"
                class="tile-message"
            >
                Select a tile, then click anywhere on the board.
            </p>

            <button
                id="newTilesButton"
                class="secondary-button"
            >
                New Tiles
            </button>

        </section>


        <!-- WORD INFORMATION -->

        <section class="information">

            <h2>Words on Board</h2>

            <p id="wordCount">
                0 words
            </p>

            <div id="wordList"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Scrabble Puzzle</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<div class="container">

    <div class="controls">
        <button id="generateButton">
            New Puzzle
        </button>
    </div>

    <div id="scoreBox" class="score-box">
        <span class="score-label">Score</span>
        <span id="scoreValue">0</span>
        <span
            id="scoreBonus"
            class="score-bonus"
        ></span>
    </div>

    <div id="wordList"></div>

    <div id="board"></div>

    <div
        id="tileMessage"
        class="tile-message"
    ></div>

    <div id="tileRack"></div>

    <div
        id="bestScoreBox"
        class="best-score-box"
    >
        <div class="best-score-title">
            Highest Possible Score
        </div>

        <div
            id="bestScoreWord"
            class="best-score-word"
        >
            —
        </div>

        <div
            id="bestScoreValue"
            class="best-score-value"
        >
            0
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scrabble Puzzle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================================
     PUZZLE GENERATOR PANEL
=========================================

    <h2>Puzzle Generator</h2>

    <p class="panel-description">
        Change these values and generate a new puzzle to test different configurations.
    </p>

    <div class="setting">

        <label for="gridSizeInput">
            Grid Size
        </label>

        <input
            id="gridSizeInput"
            type="number"
            min="5"
            max="12"
            value="7"
        >

        <span class="setting-help">
            5–12
        </span>

    </div>


    <div class="setting">

        <label for="wordCountInput">
            Number of Words
        </label>

        <input
            id="wordCountInput"
            type="number"
            min="1"
            max="8"
            value="3"
        >

        <span class="setting-help">
            Total puzzle words
        </span>

    </div>


    <div class="setting">

        <label for="initialWordLengthInput">
            Initial Word Length
        </label>

        <input
            id="initialWordLengthInput"
            type="number"
            min="3"
            max="8"
            value="6"
        >

        <span class="setting-help">
            Exact length
        </span>

    </div>


    <div
        id="generatorMessage"
        class="generator-message"
    ></div>
-->

    <button
        id="generateButton"
        type="button"
    >
        New Puzzle
    </button>

</aside>


<!-- =========================================
     MAIN GAME
========================================= -->

<div class="container">

    <div class="controls">
        <!-- New Puzzle button is now in the side panel -->
    </div>


    <div
        id="scoreBox"
        class="score-box"
    >

        <span class="score-label">
            Score
        </span>

        <span id="scoreValue">
            0
        </span>

        <span
            id="scoreBonus"
            class="score-bonus"
        ></span>

    </div>


    <div id="wordList"></div>


    <div id="board"></div>


    <div
        id="tileMessage"
        class="tile-message"
    ></div>


    <div id="tileRack"></div>

</div>


<script src="script.js"></script>

</body>
</html>

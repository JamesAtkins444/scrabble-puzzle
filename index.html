<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scrabble Puzzle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================================
     HIDDEN SCORE PANEL
========================================= -->

<aside id="hiddenScorePanel">

    <h2>Hidden Score</h2>

    <div class="hidden-score-row">
        <span>2× Letter tiles</span>
        <span id="hiddenDoubleLetterCount">0</span>
    </div>

    <div class="hidden-score-row">
        <span>2xLscore</span>
        <span id="hiddenDoubleLetterScore">0</span>
    </div>


    <div class="hidden-score-row">
        <span>3× Letter tiles</span>
        <span id="hiddenTripleLetterCount">0</span>
    </div>

    <div class="hidden-score-row">
        <span>3xLscore</span>
        <span id="hiddenTripleLetterScore">0</span>
    </div>


    <div class="hidden-score-row">
        <span>2× Word tiles</span>
        <span id="hiddenDoubleWordCount">0</span>
    </div>

    <div class="hidden-score-row">
        <span>2xWscore</span>
        <span id="hiddenDoubleWordScore">0</span>
    </div>


    <div class="hidden-score-row">
        <span>3× Word tiles</span>
        <span id="hiddenTripleWordCount">0</span>
    </div>

    <div class="hidden-score-row">
        <span>3xWscore</span>
        <span id="hiddenTripleWordScore">0</span>
    </div>


    <div class="hidden-score-divider"></div>


    <div class="hidden-score-row">
        <span>Original rack value</span>
        <span id="hiddenRackValue">0</span>
    </div>

    <div class="hidden-score-row">
        <span>RackValueAvg</span>
        <span id="hiddenRackValueAvg">0</span>
    </div>

    <div class="hidden-score-row">
        <span>+50 bonus</span>
        <span id="hiddenFiftyBonus">50</span>
    </div>


    <div class="hidden-score-total">
        <span>Hidden Score</span>
        <strong id="hiddenScoreTotal">0</strong>
    </div>

</aside>


<!-- =========================================
     MAIN GAME
========================================= -->

<div class="container">

    <div class="controls">
    </div>


    <div
        id="scoreBox"
        class="score-box"
    >

        <span class="score-label">
            Score
        </span>

        <span id="scoreValue">
            0
        </span>

        <span
            id="scoreBonus"
            class="score-bonus"
        ></span>

    </div>


    <div id="wordList"></div>


    <div id="board"></div>


    <div
        id="tileMessage"
        class="tile-message"
    ></div>


    <div id="tileRack"></div>

</div>


<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scrabble Puzzle</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <div class="controls">

            <button id="generateButton">
                New Puzzle
            </button>

        </div>


        <!--
            Kept hidden because the existing
            JavaScript expects these elements.
        -->

        <div
            id="wordCount"
            style="display: none;"
        ></div>

        <button
            id="newTilesButton"
            style="display: none;"
        ></button>


        <!-- BOARD -->

        <div id="board"></div>


        <!-- SCORING WORDS -->

        <div id="wordList"></div>


        <!-- TILE MESSAGE -->

        <div
            id="tileMessage"
            class="tile-message"
        ></div>


        <!-- PLAYER RACK -->

        <div id="tileRack"></div>


        <!-- HIGHEST POSSIBLE SCORE -->

        <div id="bestMove"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
